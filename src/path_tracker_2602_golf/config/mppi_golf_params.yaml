controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.35
      stateful: True

    # =========================================================
    # CEREBRO MPPI - OPTIMIZADO PARA DIFERENCIAL
    # =========================================================
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 30
      model_dt: 0.05
      batch_size: 2000                # Evaluamos mas trayectorias (2000)
      
      # Exploracion cinematica (Diferencial)
      vx_std: 0.4                     # Le damos mas libertad para buscar aceleraciones
      vy_std: 0.0                     # Holonomico bloqueado (es diferencial)
      wz_std: 0.8                     # Le damos mas fuerza para rotar en su eje
      vx_max: 1.0
      vx_min: 0.0
      wz_max: 2.0
      
      visualize_trajectories: True
      trajectory_visualizer_plugin: "nav2_mppi_controller::TrajectoryVisualizer"
      
      critic_plugins:
        - "ConstraintCritic"          
        - "PathAlignCritic"           
        - "PathAngleCritic"           
        - "ReferenceTrajectoryCritic" 
        - "GoalCritic"                # NUEVO: Ayuda al diferencial a no dudar al final

      ConstraintCritic:
        enabled: True
        cost_power: 1
        cost_weight: 0.1              # BAJADO drásticamente para descartar choques fantasmas

      PathAlignCritic:
        enabled: True
        cost_power: 1
        cost_weight: 5.0              # BAJADO para permitirle avanzar aunque no este perfecto

      PathAngleCritic:
        enabled: True
        cost_power: 1
        cost_weight: 2.0

      ReferenceTrajectoryCritic:
        enabled: True
        cost_power: 1
        cost_weight: 10.0             # SUBIDO masivamente: Prioridad #1 es mantener velocidad
        reference_velocity: 0.5       

      GoalCritic:
        enabled: True
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4    # A 1.4m de la meta, empieza a usar este critico

# =========================================================
# MAPA LOCAL 
# =========================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: True
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.3               # NUEVO: Le dice al mapa el tamaño físico del robot 
      plugins: ["obstacle_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True